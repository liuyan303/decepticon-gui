[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decepticon-gui"
version = "0.2.0"
description = "Windows desktop front end for Decepticon (GUI wrapper, no upstream code bundled)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Decepticon GUI contributors" }]
keywords = ["decepticon", "red-team", "pentest", "gui", "windows"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Upstream = "https://github.com/PurpleAILAB/Decepticon"
Documentation = "https://docs.decepticon.red"

[project.scripts]
decepticon-gui = "decepticon_gui.app:main"

[tool.setuptools.packages.find]
include = ["decepticon_gui*"]
